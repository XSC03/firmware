name: Build Handheld S3 32in

on:
  push:
    branches:
      - develop
      - master
      - main
    paths:
      # Workflow hanya berjalan jika ada perubahan pada file-file ini:
      - 'variants/esp32s3/diy/handheld_s3_32in/**'
      - 'variants/esp32s3/diy/handheld_s3/**'
      - 'boards/handheld-s3-32in.json'
      - '.github/workflows/build-handheld-s3.yaml'
  workflow_dispatch: # Mengaktifkan tombol "Run Workflow" manual di halaman GitHub Actions

permissions: read-all

jobs:
  build:
    name: Build firmware-handheld-s3-32in
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Proteksi jika server hang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ✅ OPTIMASI 1: Caching Kompiler + Library + Folder Build Lokal (.pio)
      - name: Cache PlatformIO & Build State
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            .pio
            firmware/.pio
          # Hash dhitung berdasarkan config platformio & source code variant agar cache terekam presisi
          key: pio-${{ runner.os }}-handheld-${{ hashFiles('**/platformio.ini', 'variants/esp32s3/diy/handheld_s3_32in/**') }}
          restore-keys: |
            pio-${{ runner.os }}-handheld-${{ hashFiles('**/platformio.ini') }}
            pio-${{ runner.os }}-handheld-
            pio-${{ runner.os }}-

      # ✅ OPTIMASI 2: Install PlatformIO setelah restore cache (hemat download)
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # ✅ OPTIMASI 3: Jalankan Kompilasi Spesifik Varian Kamu
      - name: Build handheld-s3-32in
        run: pio run -e handheld-s3-32in

      # ── Upload hasil akhir firmware sebagai Artifact ──
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: handheld-s3-32in-firmware
          # Path mengambil seluruh binary .bin, .elf, dan littlefs yang dihasilkan oleh pio
          path: |
            .pio/build/handheld-s3-32in/firmware-handheld-s3-32in-*.bin
            .pio/build/handheld-s3-32in/firmware-handheld-s3-32in-*.elf
            .pio/build/handheld-s3-32in/littlefs-handheld-s3-32in-*.bin
            .pio/build/handheld-s3-32in/firmware.bin
          retention-days: 14 # 14 hari penyimpanan sangat efisien
          overwrite: true
